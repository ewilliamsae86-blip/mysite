<script>
const img = document.querySelector(".washboard img");

let locked = false;

img.addEventListener("mouseenter", () => {
  if (locked) return;

  locked = true;
  img.classList.add("swing");
});

img.addEventListener("animationend", () => {
  img.classList.remove("swing");
  locked = false;
});
</script>
